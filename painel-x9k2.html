<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Painel · Será que Estou Louca?</title>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0928;--pink:#f036b8;--purple:#7b2fbe;--muted:#9d93c8;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:#fff;font-family:"DM Sans",sans-serif;min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:30px;}
.box{width:100%;max-width:440px;display:flex;flex-direction:column;gap:16px;}
h1{font-family:"Abril Fatface",serif;font-size:1.6rem;text-align:center;
  background:linear-gradient(140deg,#fff,var(--pink) 55%,var(--purple));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.sub{text-align:center;font-size:.8rem;color:var(--muted);}
.gate{display:flex;flex-direction:column;gap:10px;align-items:center;}
.gate input{width:100%;max-width:260px;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.15);color:#fff;font-family:"DM Sans",sans-serif;
  border-radius:10px;padding:11px 14px;font-size:.9rem;text-align:center;}
.gate button, .row button{background:var(--purple);color:#fff;border:none;border-radius:10px;
  font-family:"DM Sans",sans-serif;font-size:.8rem;font-weight:600;padding:11px 18px;cursor:pointer;}
.panel{display:none;flex-direction:column;gap:14px;}
.panel.vis{display:flex;}
.row{display:flex;gap:10px;}
.row input{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);
  color:#fff;font-family:"DM Sans",sans-serif;border-radius:10px;padding:10px 12px;font-size:.85rem;}
textarea{width:100%;min-height:220px;background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#fff;
  font-family:monospace;font-size:.85rem;padding:12px;resize:vertical;}
.actions{display:flex;gap:10px;justify-content:center;}
.actions button{background:none;border:1px solid rgba(255,255,255,.15);color:var(--muted);
  font-family:"DM Sans",sans-serif;font-size:.75rem;border-radius:16px;padding:8px 16px;cursor:pointer;}
.status{text-align:center;font-size:.75rem;color:var(--muted);min-height:16px;}
.warn{font-size:.72rem;color:rgba(255,255,255,.3);text-align:center;line-height:1.5;}
</style>
</head>
<body>
<div class="box">
  <h1>Painel de chaves</h1>
  <p class="sub">Gerador de chaves de acesso — Será que Estou Louca?</p>

  <div class="gate" id="gateBox">
    <input type="password" id="pw" placeholder="Senha de administração" autocomplete="off">
    <button onclick="checkPw()">Entrar</button>
    <p class="status" id="pwStatus"></p>
  </div>

  <div class="panel" id="panel">
    <div class="row">
      <input type="number" id="qty" value="10" min="1" max="200">
      <button onclick="generateKeys()">Gerar chaves</button>
    </div>
    <textarea id="list" readonly placeholder="As chaves geradas aparecem aqui — copie e cole num arquivo do repositório (ex: keys.txt) antes de enviar aos compradores."></textarea>
    <p class="status" id="status"></p>
    <div class="actions">
      <button onclick="copyKeys()">Copiar</button>
    </div>
  </div>

  <p class="warn">Esta página não tem link em nenhum lugar do site público. Mesmo assim, a senha fica visível a quem inspecionar o código-fonte — trate o link desta página como confidencial, não como segredo à prova de tudo.</p>
</div>
<script>
const SB_URL  = "https://rvmfonytiinfzdgirsgk.supabase.co";
const SB_KEY  = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2bWZvbnl0aWluZnpkZ2lyc2drIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3Mjg1ODQsImV4cCI6MjA5NjMwNDU4NH0.kGVmLNzLE6eK6QaaCRVw8_cNZ8aloYi5CNzWwvEpSqI";
const ADMIN_PASS = "chaves2026"; // troque por algo só seu

function checkPw() {
  const v = document.getElementById("pw").value;
  const st = document.getElementById("pwStatus");
  if (v === ADMIN_PASS) {
    document.getElementById("gateBox").style.display = "none";
    document.getElementById("panel").classList.add("vis");
  } else {
    st.textContent = "Senha incorreta.";
  }
}
async function generateKeys() {
  const qty = Math.max(1, Math.min(200, parseInt(document.getElementById("qty").value) || 10));
  const status = document.getElementById("status");
  status.textContent = "Gerando...";
  try {
    const r = await fetch(SB_URL + "/rest/v1/rpc/generate_keys", {
      method:"POST", headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"},
      body: JSON.stringify({qty})
    });
    const rows = await r.json();
    const list = (rows || []).map(row => typeof row === "string" ? row : Object.values(row)[0]);
    document.getElementById("list").value = list.join("\n");
    status.textContent = list.length + " chaves geradas e salvas no banco.";
  } catch(e) {
    status.textContent = "Erro ao gerar. Confira se as funções foram criadas no Supabase.";
  }
}
function copyKeys() {
  const ta = document.getElementById("list");
  ta.select();
  document.execCommand("copy");
  document.getElementById("status").textContent = "Copiado.";
}
document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") checkPw(); });
</script>
</body>
</html>
